---
layout: default
---
<article class="post post--page">

  {%- unless site.header_pages contains page.path -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endunless -%}

  <div class="post-content">
    {{ content }}
  </div>

</article>
