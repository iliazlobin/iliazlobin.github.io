<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
  <title id="title">Feature flag decision</title>
  <desc id="desc">A request captures configuration, checks ordered targeting rules, then makes a stable rollout decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/></marker>
  </defs>
  <rect width="880" height="620" rx="24" fill="#fff"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" fill="#202124">
    <text x="440" y="66" font-size="27" font-weight="600">One request. One configuration.</text>
    <rect x="180" y="98" width="520" height="432" rx="20" fill="#e8f0fe"/>
    <text x="440" y="131" font-size="17" fill="#3c4043">EvaluationSession</text>
    <g stroke="#9aa0a6" fill="#fff">
      <rect x="245" y="153" width="390" height="72" rx="10"/>
      <rect x="245" y="265" width="390" height="72" rx="10"/>
      <rect x="245" y="377" width="390" height="72" rx="10"/>
    </g>
    <g font-size="22">
      <text x="440" y="197">Capture snapshot + context</text>
      <text x="440" y="309">Off switch → ordered rules</text>
      <text x="440" y="421">Stable bucket → threshold</text>
    </g>
    <g stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)">
      <path d="M440 225 V255"/>
      <path d="M440 337 V367"/>
      <path d="M440 449 V470"/>
    </g>
    <rect x="293" y="480" width="294" height="76" rx="10" fill="#e6f4ea" stroke="#81c995"/>
    <text x="440" y="511" font-size="21" font-weight="600">Evaluation</text>
    <text x="440" y="538" font-size="17">value · reason · version</text>
  </g>
</svg>
